name: MANGAI Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run typecheck; npm run lint; npm test
      - name: Verify accessibility
        run: npm run test:a11y
      - name: Verify release tag and channel
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "desktop-v$version") {
            throw "Tag must be desktop-v$version."
          }
          $channel = if ($version -match '-beta(?:\.|$)') { 'beta' } elseif ($version -match '-') { throw 'Only beta prerelease versions are supported.' } else { 'stable' }
          "MANGAI_RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require signing secrets
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw "WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD secrets are required."
          }
      - name: Build signed draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MANGAI_PUBLISH_GITHUB: "1"
          MANGAI_REQUIRE_SIGNING: "1"
          MANGAI_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win:update
      - name: Verify signed artifacts
        run: npm run verify:win:artifacts -- metadata signed
      - name: Installer install and uninstall E2E
        run: npm run test:win:installer
      - name: Generate SBOM and checksums
        run: npm run generate:win:evidence
      - name: Upload release evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release upload "desktop-v$version" "release/SHA256SUMS.txt" "release/MANGAI-Desktop-$version-sbom.spdx.json" --clobber
