name: Cloud export Worker scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "通信せず設定確認、またはExport Workerを明示実行"
        required: true
        default: check
        type: choice
        options:
          - check
          - run

permissions:
  contents: read

concurrency:
  group: cloud-export-worker-production
  cancel-in-progress: false

jobs:
  check-settings:
    name: Check export scheduler settings without a worker request
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate settings without printing values
        env:
          MANGAI_CLOUD_EXPORT_SCHEDULER_ENABLED: "true"
          MANGAI_CLOUD_EXPORT_WORKER_URL: ${{ secrets.MANGAI_CLOUD_EXPORT_WORKER_URL }}
          MANGAI_CLOUD_EXPORT_WORKER_SECRET: ${{ secrets.MANGAI_CLOUD_EXPORT_WORKER_SECRET }}
        run: node scripts/run-cloud-export-worker-scheduler.mjs --check

  run-worker:
    name: Process a bounded export segment batch
    if: ${{ (github.event_name == 'schedule' && vars.MANGAI_CLOUD_EXPORT_SCHEDULER_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'run') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Process at most three export segments
        env:
          MANGAI_CLOUD_EXPORT_SCHEDULER_ENABLED: "true"
          MANGAI_CLOUD_EXPORT_WORKER_URL: ${{ secrets.MANGAI_CLOUD_EXPORT_WORKER_URL }}
          MANGAI_CLOUD_EXPORT_WORKER_SECRET: ${{ secrets.MANGAI_CLOUD_EXPORT_WORKER_SECRET }}
          MANGAI_CLOUD_EXPORT_SCHEDULER_MAX_SEGMENTS: "3"
          MANGAI_CLOUD_EXPORT_SCHEDULER_TIMEOUT_SECONDS: "285"
        run: node scripts/run-cloud-export-worker-scheduler.mjs
