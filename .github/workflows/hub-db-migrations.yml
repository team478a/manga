name: Hub DB migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/validate-supabase-migrations.mjs"
      - "scripts/check-supabase-staging.mjs"
      - ".github/workflows/hub-db-migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/validate-supabase-migrations.mjs"
      - "scripts/check-supabase-staging.mjs"
      - ".github/workflows/hub-db-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate migration files
        run: node scripts/validate-supabase-migrations.mjs
      - name: Create test databases
        run: |
          createdb migration_roundtrip
          createdb current_schema
      - name: Apply forward migrations
        run: |
          psql -v ON_ERROR_STOP=1 -d migration_roundtrip -f supabase/tests/bootstrap_supabase.sql
          psql -v ON_ERROR_STOP=1 -d migration_roundtrip -f supabase/tests/bootstrap_migration_base.sql
          for file in $(find supabase/migrations -maxdepth 1 -name '*.sql' | sort); do
            psql -v ON_ERROR_STOP=1 -d migration_roundtrip -f "$file"
          done
          psql -v ON_ERROR_STOP=1 -d migration_roundtrip -f supabase/tests/assert_migrations.sql
      - name: Roll back in reverse order
        run: |
          for file in $(find supabase/rollbacks -maxdepth 1 -name '*.sql' | sort -r); do
            psql -v ON_ERROR_STOP=1 -d migration_roundtrip -f "$file"
          done
          psql -v ON_ERROR_STOP=1 -d migration_roundtrip -f supabase/tests/assert_rollback.sql
      - name: Reapply after rollback
        run: |
          for file in $(find supabase/migrations -maxdepth 1 -name '*.sql' | sort); do
            psql -v ON_ERROR_STOP=1 -d migration_roundtrip -f "$file"
          done
          psql -v ON_ERROR_STOP=1 -d migration_roundtrip -f supabase/tests/assert_migrations.sql
      - name: Verify canonical schema is idempotent
        run: |
          psql -v ON_ERROR_STOP=1 -d current_schema -f supabase/tests/bootstrap_supabase.sql
          psql -v ON_ERROR_STOP=1 -d current_schema -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -d current_schema -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -d current_schema -f supabase/tests/assert_current_schema.sql
      - name: Run read-only staging preflight against test schema
        env:
          MANGAI_DB_ENV: staging
          PGDATABASE: current_schema
          PGSSLMODE: disable
        run: node scripts/check-supabase-staging.mjs
