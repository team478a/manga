<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">企画からネームまでの制作フロー</title>
  <desc id="desc">市場分析、AI企画提案、シナリオ作成、ネーム作成の順序を示す画面図</desc>
  <rect width="1200" height="675" fill="#fafaf9"/>
  <text x="64" y="72" fill="#18181b" font-family="system-ui, sans-serif" font-size="32" font-weight="700">企画からネームまで</text>
  <text x="64" y="108" fill="#57534e" font-family="system-ui, sans-serif" font-size="18">各工程で結果を保存・採用すると、次の工程が利用できます。</text>
  <g font-family="system-ui, sans-serif">
    <g transform="translate(64 158)"><rect width="236" height="316" rx="20" fill="#fff" stroke="#ddd6fe" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#ede9fe"/><text x="42" y="50" fill="#6d28d9" text-anchor="middle" font-size="22" font-weight="700">1</text><text x="24" y="102" fill="#18181b" font-size="23" font-weight="700">市場分析</text><text x="24" y="143" fill="#57534e" font-size="16">ジャンルとテーマを選択</text><text x="24" y="176" fill="#57534e" font-size="16">売れやすい方向を確認</text><rect x="24" y="242" width="188" height="48" rx="10" fill="#6d28d9"/><text x="118" y="272" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">結果を保存</text></g>
    <text x="319" y="322" fill="#7c3aed" font-size="30">→</text>
    <g transform="translate(348 158)"><rect width="236" height="316" rx="20" fill="#fff" stroke="#ddd6fe" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#ede9fe"/><text x="42" y="50" fill="#6d28d9" text-anchor="middle" font-size="22" font-weight="700">2</text><text x="24" y="102" fill="#18181b" font-size="23" font-weight="700">AI企画提案</text><text x="24" y="143" fill="#57534e" font-size="16">3つの企画を比較</text><text x="24" y="176" fill="#57534e" font-size="16">制作する1案を選択</text><rect x="24" y="242" width="188" height="48" rx="10" fill="#6d28d9"/><text x="118" y="272" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">企画を採用</text></g>
    <text x="603" y="322" fill="#7c3aed" font-size="30">→</text>
    <g transform="translate(632 158)"><rect width="236" height="316" rx="20" fill="#fff" stroke="#ddd6fe" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#ede9fe"/><text x="42" y="50" fill="#6d28d9" text-anchor="middle" font-size="22" font-weight="700">3</text><text x="24" y="102" fill="#18181b" font-size="23" font-weight="700">シナリオ作成</text><text x="24" y="143" fill="#57534e" font-size="16">人物とシーンを確認</text><text x="24" y="176" fill="#57534e" font-size="16">必要なら修正版を作成</text><rect x="24" y="242" width="188" height="48" rx="10" fill="#6d28d9"/><text x="118" y="272" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">シナリオを採用</text></g>
    <text x="887" y="322" fill="#7c3aed" font-size="30">→</text>
    <g transform="translate(916 158)"><rect width="220" height="316" rx="20" fill="#fff" stroke="#ddd6fe" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#ede9fe"/><text x="42" y="50" fill="#6d28d9" text-anchor="middle" font-size="22" font-weight="700">4</text><text x="24" y="102" fill="#18181b" font-size="23" font-weight="700">ネーム作成</text><text x="24" y="143" fill="#57534e" font-size="16">コマ割りとセリフを確認</text><text x="24" y="176" fill="#57534e" font-size="16">Canvas下書きを作成</text><rect x="24" y="242" width="172" height="48" rx="10" fill="#6d28d9"/><text x="110" y="272" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">ネームを採用</text></g>
  </g>
  <rect x="64" y="518" width="1072" height="92" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="92" y="554" fill="#9a3412" font-family="system-ui, sans-serif" font-size="17" font-weight="700">操作のポイント</text>
  <text x="92" y="588" fill="#7c2d12" font-family="system-ui, sans-serif" font-size="17">生成ボタンは1回だけ押し、完了表示を確認してから次へ進みます。</text>
</svg>
