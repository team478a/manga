<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">原稿編集の作品画面</title>
  <desc id="desc">完成ガイド、原稿チェック、人物と画風の設定、画像生成の入口を示す匿名化した画面図</desc>
  <rect width="1200" height="675" fill="#f7f5ff"/>
  <rect x="42" y="34" width="1116" height="76" rx="16" fill="#fff"/>
  <text x="70" y="66" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">制作ステップ 5</text>
  <text x="70" y="94" fill="#18181b" font-family="system-ui, sans-serif" font-size="25" font-weight="700">原稿編集　／　作品画面</text>
  <g font-family="system-ui, sans-serif">
    <rect x="42" y="134" width="534" height="220" rx="18" fill="#fff" stroke="#ddd6fe"/>
    <text x="70" y="174" fill="#18181b" font-size="22" font-weight="700">完成・復旧の準備</text>
    <text x="70" y="205" fill="#57534e" font-size="15">画像生成からPDFまでの現在地を確認します。</text>
    <rect x="70" y="230" width="478" height="44" rx="10" fill="#f5f3ff"/><text x="88" y="258" fill="#5b21b6" font-size="16">1. 原稿を確定　画像未生成があれば生成へ</text>
    <rect x="70" y="287" width="478" height="44" rx="10" fill="#ecfdf5"/><text x="88" y="315" fill="#065f46" font-size="16">2. 復旧できる状態を保存</text>
    <rect x="606" y="134" width="552" height="220" rx="18" fill="#fff" stroke="#e7e5e4"/>
    <text x="634" y="174" fill="#18181b" font-size="22" font-weight="700">原稿チェック</text>
    <text x="634" y="207" fill="#57534e" font-size="15">空コマ・文字・品質検査を確認します。</text>
    <rect x="634" y="232" width="146" height="78" rx="12" fill="#fafaf9"/><text x="652" y="258" fill="#78716c" font-size="13">画像配置済み</text><text x="652" y="293" fill="#18181b" font-size="24" font-weight="700">進捗を表示</text>
    <rect x="798" y="232" width="146" height="78" rx="12" fill="#fff7ed"/><text x="816" y="258" fill="#9a3412" font-size="13">画像未生成</text><text x="816" y="293" fill="#9a3412" font-size="24" font-weight="700">残数を表示</text>
    <rect x="962" y="232" width="168" height="78" rx="12" fill="#fef2f2"/><text x="980" y="258" fill="#991b1b" font-size="13">完成前チェック</text><text x="980" y="293" fill="#991b1b" font-size="24" font-weight="700">要修正</text>
    <rect x="42" y="382" width="1116" height="206" rx="18" fill="#fff" stroke="#e7e5e4"/>
    <text x="70" y="424" fill="#18181b" font-size="22" font-weight="700">画像生成前に固定する項目</text>
    <rect x="70" y="450" width="320" height="72" rx="12" fill="#f5f3ff"/><text x="90" y="480" fill="#5b21b6" font-size="16" font-weight="700">外見・衣装の設定</text><text x="90" y="505" fill="#57534e" font-size="14">髪・体格・衣装・固定特徴</text>
    <rect x="410" y="450" width="320" height="72" rx="12" fill="#f5f3ff"/><text x="430" y="480" fill="#5b21b6" font-size="16" font-weight="700">画風・場所・小物</text><text x="430" y="505" fill="#57534e" font-size="14">線・陰影・背景・重要な小物</text>
    <rect x="750" y="450" width="380" height="72" rx="12" fill="#f5f3ff"/><text x="770" y="480" fill="#5b21b6" font-size="16" font-weight="700">参照画像とコマ割当</text><text x="770" y="505" fill="#57534e" font-size="14">登場人物・場所・小物を各コマへ</text>
    <rect x="70" y="542" width="1060" height="30" rx="8" fill="#ecfdf5"/><text x="600" y="563" fill="#065f46" text-anchor="middle" font-size="15">設定後、「画像生成するページを選ぶ」へ進みます。</text>
  </g>
  <text x="1140" y="646" fill="#78716c" text-anchor="end" font-family="system-ui, sans-serif" font-size="13">画面例：作品名・数値は表示していません</text>
</svg>
