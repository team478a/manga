<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">MANGAI Cloudダッシュボード</title>
  <desc id="desc">左の制作ワークフローと市場分析開始ボタンの位置を示す匿名化した画面図</desc>
  <rect width="1200" height="675" fill="#f7f5ff"/>
  <rect width="1200" height="78" fill="#fff"/>
  <text x="56" y="49" fill="#18181b" font-family="system-ui, sans-serif" font-size="27" font-weight="700">MANGAI Creator</text>
  <rect x="0" y="78" width="258" height="597" fill="#fff"/>
  <rect x="20" y="102" width="218" height="64" rx="12" fill="#f0eaff"/>
  <text x="38" y="128" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="14">ログイン中</text>
  <text x="38" y="151" fill="#18181b" font-family="system-ui, sans-serif" font-size="17" font-weight="700">購入者アカウント</text>
  <text x="28" y="205" fill="#78716c" font-family="system-ui, sans-serif" font-size="14">制作ワークフロー</text>
  <g font-family="system-ui, sans-serif" font-size="18" fill="#292524">
    <text x="32" y="249">1　市場分析</text><text x="32" y="298">2　AI企画提案</text>
    <text x="32" y="347">3　シナリオ作成</text><text x="32" y="396">4　ネーム作成</text>
    <text x="32" y="445">5　原稿編集</text><text x="32" y="494">6　作品管理</text>
  </g>
  <rect x="292" y="112" width="848" height="114" rx="18" fill="#fff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="326" y="149" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="15" font-weight="700">現在の制作進行</text>
  <text x="326" y="187" fill="#18181b" font-family="system-ui, sans-serif" font-size="28" font-weight="700">1. 市場分析</text>
  <rect x="905" y="145" width="199" height="52" rx="10" fill="#6d28d9"/>
  <text x="1004" y="178" fill="#fff" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700">市場分析を開始</text>
  <rect x="292" y="254" width="848" height="316" rx="18" fill="#fff" stroke="#e7e5e4"/>
  <text x="326" y="302" fill="#18181b" font-family="system-ui, sans-serif" font-size="24" font-weight="700">この画面から順番に進めます</text>
  <g font-family="system-ui, sans-serif">
    <rect x="326" y="334" width="232" height="92" rx="14" fill="#f5f3ff"/><text x="346" y="366" fill="#6d28d9" font-size="15" font-weight="700">① 左メニュー</text><text x="346" y="397" fill="#44403c" font-size="17">現在の工程を確認</text>
    <rect x="581" y="334" width="232" height="92" rx="14" fill="#f5f3ff"/><text x="601" y="366" fill="#6d28d9" font-size="15" font-weight="700">② 紫のボタン</text><text x="601" y="397" fill="#44403c" font-size="17">次の操作を開始</text>
    <rect x="836" y="334" width="232" height="92" rx="14" fill="#f5f3ff"/><text x="856" y="366" fill="#6d28d9" font-size="15" font-weight="700">③ 利用状況</text><text x="856" y="397" fill="#44403c" font-size="17">残り回数を確認</text>
  </g>
  <rect x="326" y="461" width="742" height="70" rx="12" fill="#ecfdf5"/>
  <text x="351" y="504" fill="#065f46" font-family="system-ui, sans-serif" font-size="18">保存・採用が終わると、次の工程へ進む案内が表示されます。</text>
  <text x="1140" y="646" fill="#78716c" text-anchor="end" font-family="system-ui, sans-serif" font-size="13">画面例：表示内容は利用状況によって異なります</text>
</svg>
